name: Build Customer Ledger APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Removed the failing "Set up Android SDK" step completely.
      # GitHub runners already have it, and Gradle will fetch anything missing.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          set -eux

          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found in repository root"
            exit 1
          fi

          rm -rf project
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          PROJECT_DIR=$(find project -type f \
            \( -name "settings.gradle" -o \
               -name "settings.gradle.kts" \) \
            | head -n 1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "No Android project found inside ZIP"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

       - name: Force Java 17
        run: |
          cat > "$PROJECT_DIR/force-java17.gradle" <<'EOF'
          allprojects {
              tasks.withType(
                  org.gradle.api.tasks.compile.JavaCompile
              ).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }
          }
          EOF

      - name: Build APK
        run: |
          set -eux
          gradle -p "$PROJECT_DIR" \
            -I "$PROJECT_DIR/force-java17.gradle" \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Customer-Ledger-APK
          path: project/**/build/outputs/apk/debug/*.apk
