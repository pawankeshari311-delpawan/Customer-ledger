ame: Build Customer Ledger APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          set -eux

          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found in repository root"
            exit 1
          fi

          rm -rf project
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          PROJECT_DIR=$(find project -type f \
            \( -name "settings.gradle" -o \
               -name "settings.gradle.kts" \) \
            | head -n 1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "No Android project found inside ZIP"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          set -eux
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Customer-Ledger-APK
          path: project/**/build/outputs/apk/debug/*.apk